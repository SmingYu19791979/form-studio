<!doctype html><meta charset="utf-8"><title>分件建模验证</title><pre id="report">检查中…</pre><script type="module">
import * as T from './assets/three.js';import {readPhoto} from './photo-model.js';import {analyzeParts,createPartsModel} from './packaging-model.js';import {createLaneige} from './laneige.js';
const log=[];function check(v,s){if(!v)throw new Error(s);log.push('PASS '+s)}try{const photo=await readPhoto('assets/reference.png'),c=analyzeParts(photo),parts=createPartsModel(photo,c);check(parts.children.some(n=>n.name==='独立罐盖')&&parts.children.some(n=>n.name==='独立瓶颈')&&parts.children.some(n=>n.name==='独立顶盘'),'盖、颈、身、顶盘是独立部件');check(parts.children.some(n=>n.name==='独立金属包边')&&parts.children.some(n=>n.name==='独立印刷层'),'包边与印刷独立处理');const body=parts.children.find(n=>n.name==='罐身 / 瓶身').children[0],cap=parts.children.find(n=>n.name==='独立罐盖').children[0];check(body.material!==cap.material,'盖与罐身使用独立物理材质');const map=body.material.map.image.getContext('2d').getImageData(0,0,192,192).data;let min=255,max=0;for(let i=0;i<map.length;i+=4){min=Math.min(min,map[i]);max=Math.max(max,map[i])}check(max-min<=69,'罐身为微观颗粒材质，未把整张照片高光贴上去');const changed=createPartsModel(photo,{...c,capHeight:30,neckHeight:10});const bb=new T.Box3().setFromObject(changed.children.find(n=>n.name==='独立罐盖'));check(Math.abs(bb.getSize(new T.Vector3()).y-.9)<.005,'独立盖高调节真实改变几何');check(c.capHeight>=26&&c.capHeight<=65,'分界提取位于合理盖体范围');
const renderer=new T.WebGLRenderer();const exact=await createLaneige(renderer);check(exact.userData.buildMethod==='calibrated-laneige'&&exact.children.length===9,'专属面霜使用原来的九部件模型');check(exact.children.some(n=>n.name==='缎面顶盘')&&exact.children.some(n=>n.name==='正面独立印刷'),'原有缎面顶盘与精确印刷层保留');check(exact.children[0].material.roughness===.65&&exact.children[0].material.bumpMap,'专属颗粒和物理材质配方保留');renderer.dispose();document.querySelector('#report').textContent=log.join('\n')+'\nALL CHECKS PASSED'}catch(e){document.querySelector('#report').textContent=log.join('\n')+'\nFAIL '+e.stack}
</script>
